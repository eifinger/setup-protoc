name: Update docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update docs for (for example, v1.2.3)"
        required: true
        type: string

permissions: {}

jobs:
  update-docs:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Get tag info
        id: tag-info
        env:
          INPUT_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Tag must match vMAJOR.MINOR.PATCH'
            exit 1
          fi

          COMMIT_SHA=$(git rev-parse --verify "refs/tags/${INPUT_TAG}^{commit}")
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
      - name: Update references in docs
        env:
          NEW_SHA: ${{ steps.tag-info.outputs.sha }}
          NEW_VERSION: ${{ steps.tag-info.outputs.tag }}
        run: |
          git ls-files -z -- '*.md' | xargs -0 --no-run-if-empty sed -i -E \
            "s~eifinger/setup-protoc@([a-f0-9]{40}|<commit-sha>)([[:blank:]]+#[[:blank:]]+v[0-9]+\.[0-9]+\.[0-9]+)?~eifinger/setup-protoc@${NEW_SHA} # ${NEW_VERSION}~g"
      - name: Check for changes
        id: changes-exist
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'changes-exist=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changes-exist=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create Pull Request
        if: steps.changes-exist.outputs.changes-exist == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "docs: update version references to ${{ steps.tag-info.outputs.tag }}"
          title: "docs: update version references to ${{ steps.tag-info.outputs.tag }}"
          body: |
            Update setup-protoc references in documentation to
            `${{ steps.tag-info.outputs.sha }} # ${{ steps.tag-info.outputs.tag }}`.
          base: main
          labels: automated-pr,documentation
          branch: update-docs-${{ steps.tag-info.outputs.tag }}
          delete-branch: true
