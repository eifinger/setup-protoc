name: Update known checksums

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions: {}

concurrency:
  group: update-known-checksums
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'eifinger/setup-protoc'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run update-known-checksums
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run all
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/known-checksums
          commit-message: "chore: update known protoc checksums"
          title: "chore: update known protoc checksums"
          body: Update the bundled checksums from official protobuf releases.
          add-paths: |
            src/known-checksums.json
            dist/
          delete-branch: true
